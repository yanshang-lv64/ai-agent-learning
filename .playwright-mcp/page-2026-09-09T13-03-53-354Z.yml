                - generic [ref=f27e130]: 华港财富是一家专注于中国及亚太地区的数字化家族办公室平台，为该地区创新领导者及其家族提供全方位的财富管理解决方案，致力于为其创造可持续的长期价值。 在过去的十年中，大批优质的新兴科技、消费、互联网企业迅速崛起，成为推动经济发展的中流砥柱，中国及亚太地区创新领导者应运而生。面向这一人群日益增长的财富管理需求，华港财富立足本地市场洞察与数字化优势，通达全球资源，坚持“只为更简单的财富管理”， 基于专业独立的外部资产管理人（External Asset Manager，EAM）模式，业务覆盖财富管理、资产管理、家族办公室、金融科技和孵化平台，一站式满足客户多样化、个性化的财富管理需求，成为客户值得信赖的首选合作伙伴。
