              - generic [ref=f14e48]: 岗位职责 1. 大模型与智能 Agent 开发 - 参与构建基于 LangGraph / MCP / LlamaIndex 的智能 Agent 应用，负责工作流编排、工具集成及任务执行链路设计。 - 参与实现文档解析、检索增强（RAG）、向量检索、Prompt 设计等大模型应用能力。 - 协助进行模型效果评估、调用链路调优、场景适配与业务落地实施。 2. 后端服务与系统开发 - 使用 FastAPI 或 Spring Boot 构建大模型应用相关 API 服务，支持异步任务处理和工具调用。 - 参与数据库设计与实现，使用 MySQL、Redis、MongoDB 等完成数据存储与查询优化。 - 协助实现系统监控、日志记录、接口测试及服务性能优化。 3. 工程化与交付支持 - 参与服务容器化、环境部署与基本 CI/CD 流程，使用 Docker、GitHub Actions 或 GitLab CI。 - 编写相关技术文档、接口文档，协助开展代码 Review，提升系统稳定性和工程质量。 任职要求 1. 计算机科学、人工智能、软件工程等相关专业，本科或研究生在读，具备扎实的计算机基础知识。 2. 熟练掌握 Python 或 Java 任一后端开发语言，并熟悉相应技术栈（FastAPI / Spring Boot）。 3. 熟练使用AI开发工具进行敏捷开发，了解一种前端框架（Vue3 或 React），具备基本的 Web 开发与调试能力。 4. 理解大语言模型及其相关概念，包括 Prompt 设计、Embedding、RAG、微调等。 5. 熟悉 MySQL、Redis、MongoDB 等常用数据库，了解基本的索引优化或缓存机制。 6. 熟悉 Git 版本控制，具备良好的工程化意识与代码规范。 7. 每周实习不少于 4 天，实习时间不少于 4 个月，具备良好的沟通能力、责任心与自驱力。 加分项 1. 有 LangGraph、LlamaIndex、Autogen、OpenAI MCP 等大模型应用或 Agent 项目经验。 2. 具备检索增强系统（RAG）的实践经验，包括文档预处理、向量检索、召回优化等。 3. 熟悉前后端全栈开发流程，有从零构建完整 Web 应用的经验。 4. 了解 Docker、Kubernetes、Kafka 或 DevOps 等云原生技术。 5. 有模型评估、链路分析、可观测性工具等相关经验。 6. 在开源社区有贡献者经历或拥有个人技术项目者优先。
