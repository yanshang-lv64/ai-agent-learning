              - generic [ref=f16e50]: 职位描述：
              - generic [ref=f16e51]: 工作职责： 企业智能部Intelligence Lab是小红书面向 AI-native 组织建设的创新团队，聚焦企业级 AI Agent、AI-native 管理产品、智能工作流与组织智能方向。我们希望通过大模型和 Agent 技术，帮助公司提升决策、管理和协同效率，让工作回归创造。 本岗位面向 AI Agent 算法方向，适合对大模型应用、Agent、RAG、工具调用、模型评测、上下文工程等方向有强兴趣，并希望在真实业务场景中做算法落地的同学。 1、参与企业级 AI Agent 能力建设，包括任务拆解、工具调用、上下文管理、结果校验、多轮交互、记忆机制等模块的实验和优化。 2、参与小红书内部 AI-native 产品和 Agent 场景落地，覆盖 OKR、经营分析、知识协同、数据分析、业务诊断、工作流自动化等方向。 3、参与大模型应用算法实验，包括 Prompt 优化、RAG 优化、工具选择、Agentic Workflow、多 Agent 协作等。 4、参与 Agent 评测体系建设，包括构建评测集、设计评测指标、分析 badcase、总结优化策略，并推动效果迭代。 5、参与大模型应用中的 Prompt / RAG / Tool Use / 多 Agent 协作 / 记忆与状态管理等算法模块建设，并推动在产品中落地。 任职资格： 1、本科及以上在读，计算机、人工智能、自然语言处理、机器学习、数据科学、数学、统计学等相关专业优先。 2、对大模型、AI Agent、RAG、Tool Use、Prompt Engineering、模型评测等方向有强兴趣。 3、具备较好的 Python 编程能力，熟悉常见机器学习 / 深度学习 / NLP 基础，有相关项目经验优先。 4、有大模型应用开发或算法实验经验者优先，例如知识库问答、Agent、数据分析助手、自动化工作流、SQL 生成、信息抽取等。 5、具备较强的学习能力、问题拆解能力和实验意识，能够通过数据和 badcase 分析推动效果优化。 6、沟通表达清晰，有责任心，能与产品、研发、数据、业务同学协作推进项目。 7、每周可实习 4 天及以上，连续实习 3 个月以上；可实习 6 个月以上优先。 【加分项】 有 RAG、检索排序、知识图谱、Prompt 优化、模型评测、SQL 生成、数据分析 Agent 等项目经验。 有论文、竞赛、开源项目或高质量课程项目经历，方向包括 NLP、IR、LLM、Agent、推荐、数据挖掘等。 对企业效率工具、组织管理、数据分析、知识协同、工作流自动化等场景有兴趣。 有较强的产品 sense，能从用户真实问题出发思考 Agent 能力如何落地，而不只是调模型接口。 【你将获得】 实习转正，优先拿到正式offer！ 参与小红书企业智能核心项目，接触真实复杂业务场景中的 AI Agent 算法问题。 深入参与大模型应用从实验、评测、优化到产品落地的全过程。 与 Product Lab、Research Lab、AI Workflow FDE 协作，理解 AI Agent 如何在企业内部规模化应用。 快速积累 Agent 算法、RAG、上下文工程、模型评测和 AI-native 产品落地经验。
