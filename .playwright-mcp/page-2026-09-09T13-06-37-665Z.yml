              - generic [ref=f67e162]: "携程集团是全球领先的一站式旅游服务供货商，旗下品牌包括Trip.com、携程、Skyscanner及去哪儿网。携程集团于1999年创立，2003年在纳斯达克上市（NASDAQ: TCOM），2021年在香港交易所正式挂牌（HKEX: 09961）。携程集团为世界各地旅客全方位搜罗及整合旅游信息，让用户可以轻松预订旅游产品及服务，做出最精明的选择。集团品牌已构建先进成熟的交易平台，包括移动客户端、网页，以及24小时全球客户服务支持。通过携程集团丰富的产品及创新的营销策略，合作伙伴及供货商得以接触快速增长的全球用户。携程集团一直毋忘初衷，秉承「追求完美旅程，共建美好世界」的宗旨，致力为所有用户打造完美的旅行体验。"
