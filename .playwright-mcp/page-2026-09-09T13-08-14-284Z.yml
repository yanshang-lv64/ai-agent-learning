              - heading "公司介绍" [level=3] [ref=f88e163]
              - generic [ref=f88e164]: 蔚来是一家全球化的智能电动汽车公司，于2014年11月成立，致力于通过提供高性能的智能电动汽车与极致用户体验，共创可持续和更美好的未来。蔚来是全球***在美国、中国香港、新加坡三地上市的汽车企业。蔚来公司旗下现有NIO蔚来、ONVO乐道、firefly萤火虫三大品牌。经过十年的发展，蔚来公司已成为全球领先的智能电动汽车企业之一。蔚来坚持核心技术的正向研发，截至2025年1月底，申请中及已授权专利总数9800余件，同时建立了由12个领域的技术栈构成的“蔚来技术全栈”。蔚来在上海、合肥、北京、南京、深圳、杭州、武汉、圣何塞、慕尼黑、牛津、柏林、布达佩斯、新加坡以及阿布扎比等地设立了研发与生产机构，并在中国、挪威、德国、荷兰、瑞典、丹麦、阿联酋、以色列、阿塞拜疆等国家建立销售和服务体系。蔚来品牌目前有九款高端智能电动车型在售，乐道品牌目前有一款车型在售，firefly萤火虫产品已开启中国市场预售。截至2025年2月28日，蔚来公司已累计交付新车698,619台，蔚来品牌持续引领30万以上高端纯电市场。
