                - generic [ref=f55e133]: Mondo Tech妙动科技成立于2025年1月，总部坐落于深圳南山，在美国硅谷Palo Alto设有研发办公室，我们以全栈式机器人核心技术为基石、以兼具可玩性与智能化的娱乐机器人产品为载体，致力于成为全球领先的消费智能机器人公司。我们的团队成员主要来自大疆、华为、OPPO等头部智能硬件厂商及卡内基梅隆大学、香港科技大学、上海交通大学等知名高校，在机器人算法、相机硬件、电机结构、图传等领域经验丰富。我们崇尚科技创新，实行扁平化管理，氛围轻松融洽。期待您的加入，一起开创智能机器人新时代！创始人背景：CEO：高建荣，武汉大学学士学位，历任大疆总经理助理、RoboMaster总监、供应链负责人、市场部负责人及大疆教育负责人，经过8年时间，把RoboMaster打造成全球最好的机器人赛事。CTO：杨硕，香港科技大学硕士&卡内基梅隆大学机器人学博士，博士期间从事复杂机器人系统运动轨迹规划方面的研究，前大疆智能导航技术总监，参与Phantom4、Mavic的开发工作，前特斯拉人形机器人Optimus运动控制模块负责人和核心架构师。
